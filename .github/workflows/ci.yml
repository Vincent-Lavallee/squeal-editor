name: CI

on:
    pull_request:
        branches: [dev]
    push:
        branches: [dev]

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
            - run: bun install
            - run: bun run lint
            - run: bun run format:check

    knip:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
            - run: bun install
            - run: bun run knip

    typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
            - run: bun install
            - run: bun run typecheck

    # A smoke test that the frontend and the extension actually compile. It is
    # not the cross-platform packaging release.yml does (the window chrome DLL,
    # the installer, the signed update assets) -- that only runs on a merge to
    # dev, needs secrets a PR from a fork can't see, and would triple the runner
    # cost of every push. The Windows half of this same build is exercised for
    # real by test-ui below, which builds both before it launches the app.
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
            - run: bun install
            - run: bun run build
            - run: bun run build:ext

    # `bun test` needs real MySQL and Postgres (docs/testing.md: every bug found
    # here was invisible to a mock), and SQUEAL_TEST_DB_NATIVE keeps CI off
    # Docker entirely -- see "CI provisions test databases without Docker" in
    # docs/decisions.md for why.
    test-extension:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
            - run: bun install
            - uses: ikalnytskyi/action-setup-postgres@v8
              with:
                  username: postgres
                  password: secret
                  port: 55432
            - uses: shogo82148/actions-setup-mysql@v1
              with:
                  mysql-version: '8.0'
                  root-password: secret
                  my-cnf: |
                      port=53306
            - run: bun run test:db:up
              env:
                  SQUEAL_TEST_DB_NATIVE: '1'
            # assistant.test.ts and saved.test.ts exercise the real OS keychain
            # (docs/decisions.md: "Saved connections..."), which on Linux is
            # Bun.secrets talking to libsecret -- and libsecret needs a real Secret
            # Service behind it. gnome-keyring provides one; dbus-run-session wraps
            # the step in its own D-Bus session so the daemon started inside it is
            # what `bun test` finds. Same recipe zalando/go-keyring's own CI uses.
            - name: Install a keyring for libsecret
              run: sudo apt-get update -qq && sudo apt-get install -y -qq gnome-keyring dbus-x11 libsecret-1-0
            - name: Run the extension suite
              shell: dbus-run-session -- bash --noprofile --norc -eo pipefail {0}
              run: |
                  echo 'test' | gnome-keyring-daemon --unlock
                  bun test

    # WebView2 only exposes CDP through a browser argument (docs/testing.md), so
    # this suite is Windows-only. `bun run test:ui` builds the frontend and
    # compiles the extension itself before it launches the app -- see its own
    # note in package.json/testing.md -- so there is no separate build step here.
    test-ui:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
            - run: bun install
            - uses: ikalnytskyi/action-setup-postgres@v8
              with:
                  username: postgres
                  password: secret
                  port: 55432
            - uses: shogo82148/actions-setup-mysql@v1
              with:
                  mysql-version: '8.0'
                  root-password: secret
                  my-cnf: |
                      port=53306
            - run: bun run test:db:up
              env:
                  SQUEAL_TEST_DB_NATIVE: '1'
            # TEMPORARY: bun run test:ui waited 120 real seconds for CDP with
            # zero response -- too long to be a cold-start issue. The prior run
            # of this diagnostic confirmed msedgewebview2 processes come up fine
            # but nothing ever binds :9333, which matches Chrome/Edge 136+
            # silently ignoring --remote-debugging-port on the *default* profile
            # directory (developer.chrome.com/blog/remote-debugging-port).
            # Testing the documented fix -- a non-default WEBVIEW2_USER_DATA_FOLDER
            # -- before committing it to tests/helpers/app.ts. Remove once known.
            - name: Diagnose the app launch directly
              if: always()
              run: |
                  bun run build
                  bun run build:ext
                  $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9333'
                  $env:WEBVIEW2_USER_DATA_FOLDER = "$env:RUNNER_TEMP\webview2-diag"
                  Start-Process -FilePath bun -ArgumentList 'x','neu','run' -NoNewWindow
                  Start-Sleep -Seconds 30
                  Write-Output '--- processes ---'
                  Get-Process | Where-Object { $_.ProcessName -match 'neutralino|webview|msedge|squeal' } | Format-Table Id, ProcessName, Path -AutoSize
                  Write-Output '--- netstat 9333 ---'
                  netstat -ano | Select-String ':9333'
                  Write-Output '--- GET /json ---'
                  try { (Invoke-WebRequest -Uri 'http://127.0.0.1:9333/json' -UseBasicParsing -TimeoutSec 5).Content } catch { Write-Output "request failed: $_" }
                  Write-Output '--- neutralinojs.log ---'
                  if (Test-Path neutralinojs.log) { Get-Content neutralinojs.log } else { Write-Output 'no neutralinojs.log was written' }
                  Get-Process neutralino-win_x64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
                  Get-Process squeal-db-ext -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            - run: bun run test:ui
            # The app's own stdout/stderr are discarded (tests/helpers/app.ts), so
            # when it never exposes a CDP page target this is the only way to see
            # why -- neutralino.config.json turns on writeToLogFile.
            - name: Show the app's log if it never came up
              if: failure()
              run: if (Test-Path neutralinojs.log) { Get-Content neutralinojs.log } else { Write-Output 'no neutralinojs.log was written' }
